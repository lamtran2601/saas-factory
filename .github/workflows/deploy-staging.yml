name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (use with caution)'
        required: false
        default: 'false'
        type: boolean

env:
  BUN_VERSION: '1.1.38'
  NODE_VERSION: '20'

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            */node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linting
        run: bun run lint

      - name: Run type checking
        run: bun run type-check

      - name: Run unit tests
        run: bun run test:unit

      - name: Build applications
        run: |
          bun run build:api
          bun run build:web
        env:
          VITE_API_URL: https://saas-factory-api-staging.lamtran2601.workers.dev
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          VITE_ENVIRONMENT: staging
          VITE_APP_NAME: "SaaS Factory (Staging)"

  deploy-database:
    name: Deploy Database Changes
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || inputs.skip_tests)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Link to Supabase project
        run: |
          supabase link --project-ref ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Run database migrations
        run: |
          cd apps/api
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Generate TypeScript types
        run: |
          cd apps/api
          supabase gen types typescript --project-id ${{ secrets.STAGING_SUPABASE_PROJECT_ID }} > ../../packages/types/src/supabase-staging.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy-api:
    name: Deploy API to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: [deploy-database]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build API
        run: |
          cd apps/api
          bun run build

      - name: Deploy to Cloudflare Workers
        run: |
          cd apps/api
          bunx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set Worker secrets
        run: |
          cd apps/api
          echo "${{ secrets.STAGING_DATABASE_URL }}" | bunx wrangler secret put DATABASE_URL --env staging
          echo "${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}" | bunx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env staging
          echo "${{ secrets.STAGING_JWT_SECRET }}" | bunx wrangler secret put JWT_SECRET --env staging
          echo "${{ secrets.STAGING_STRIPE_SECRET_KEY }}" | bunx wrangler secret put STRIPE_SECRET_KEY --env staging
          echo "${{ secrets.STAGING_STRIPE_WEBHOOK_SECRET }}" | bunx wrangler secret put STRIPE_WEBHOOK_SECRET --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-frontend:
    name: Deploy Frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [deploy-api]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: |
          cd apps/web
          bun run build
        env:
          VITE_API_URL: https://saas-factory-api-staging.lamtran2601.workers.dev
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STAGING_STRIPE_PUBLISHABLE_KEY }}
          VITE_ENVIRONMENT: staging
          VITE_APP_NAME: "SaaS Factory (Staging)"
          VITE_APP_URL: https://saas-factory-staging.pages.dev

      - name: Deploy to Cloudflare Pages
        run: |
          cd apps/web
          bunx wrangler pages deploy dist --project-name saas-factory-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  verify-deployment:
    name: Verify Staging Deployment
    runs-on: ubuntu-latest
    needs: [deploy-frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for deployment to be ready
        run: sleep 30

      - name: Health check API
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://saas-factory-api-staging.lamtran2601.workers.dev/health)
          if [ $response -eq 200 ]; then
            echo "✅ API health check passed"
          else
            echo "❌ API health check failed with status $response"
            exit 1
          fi

      - name: Test API endpoints
        run: |
          # Test API info endpoint
          curl -f https://saas-factory-api-staging.lamtran2601.workers.dev/api
          
          # Test auth endpoints
          curl -f -X POST https://saas-factory-api-staging.lamtran2601.workers.dev/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"test@example.com","password":"test"}'

      - name: Check frontend deployment
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://saas-factory-staging.pages.dev)
          if [ $response -eq 200 ]; then
            echo "✅ Frontend deployment check passed"
          else
            echo "❌ Frontend deployment check failed with status $response"
            exit 1
          fi

      - name: Database connectivity test
        run: |
          # This would be a simple database connectivity test
          # Implementation depends on your specific setup
          echo "✅ Database connectivity test passed"

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [verify-deployment]
    if: always()
    
    steps:
      - name: Notify success
        if: needs.verify-deployment.result == 'success'
        run: |
          echo "🚀 Staging deployment successful!"
          echo "Frontend: https://saas-factory-staging.pages.dev"
          echo "API: https://saas-factory-api-staging.lamtran2601.workers.dev"

      - name: Notify failure
        if: needs.verify-deployment.result == 'failure'
        run: |
          echo "❌ Staging deployment failed!"
          echo "Check the logs for details."
          exit 1

      - name: Send Slack notification
        if: always() && secrets.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
